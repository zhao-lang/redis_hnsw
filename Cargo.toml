[package]
name = "redis_hnsw"
version = "0.3.0"
authors = ["Zhao Lang <eltoshan@gmail.com>"]
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type=["cdylib"]

[dependencies]
redis-module = "2"
redismodule_cmd = { version = "0.2.0", features = ["docgen"] }
rand = "0.10"
ordered-float = "5"
num-traits = "0.2"

